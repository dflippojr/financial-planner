sonar.organization=dflippojr
sonar.projectKey=dflippojr_financial-planner
sonar.projectName=financial-planner
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.sources=finance,financial_planner,scripts
sonar.tests=tests
sonar.exclusions=**/.venv/**,**/__pycache__/**,**/.pytest_cache/**,**/migrations/**,**/node_modules/**
