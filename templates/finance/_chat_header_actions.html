{% if chat_ready %}
  {# From lg up these actions sit in the conversation list (issue #333). #}
  <div class="flex flex-wrap gap-2 lg:hidden">
    <form method="post" action="{% url 'chat-new' %}">
      {% csrf_token %}
      <button type="submit" class="btn min-h-11 max-md:btn-square md:btn-sm" aria-label="New conversation">
        <svg xmlns="http://www.w3.org/2000/svg" class="size-5 md:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span class="hidden md:inline">New conversation</span>
      </button>
    </form>
    <form method="post" action="{% url 'chat-delete-all' %}" data-confirm="Delete every conversation?" class="max-md:hidden">
      {% csrf_token %}
      <button type="submit" class="btn btn-sm btn-outline">Delete all</button>
    </form>
  </div>
{% endif %}
