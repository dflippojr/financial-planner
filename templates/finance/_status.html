{% comment %}
Status as an icon plus a word (issue #328), so colour is never the only signal.
Pass word (Over, Unread, Missing import, Projected) and optionally icon: warning (default),
unread or projected. The surrounding element sets the colour.
{% endcomment %}
<span class="status-tag">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    {% if icon == "unread" %}<circle cx="12" cy="12" r="4" fill="currentColor"/>
    {% elif icon == "projected" %}<circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/>
    {% else %}<path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>{% endif %}
  </svg>
  <span>{{ word }}</span>
</span>
