{% if series.merge_targets %}
<form method="post" class="mb-2 flex flex-wrap items-end gap-2">
  {% csrf_token %}
  <input type="hidden" name="series_id" value="{{ series.pk }}">
  <input type="hidden" name="action" value="merge">
  <label class="form-control w-full max-w-xs">
    <span class="label-text">Merge into…</span>
    <select name="target_id" class="select select-bordered select-sm" required>
      <option value="" disabled selected>Choose a series</option>
      {% for target in series.merge_targets %}
        <option value="{{ target.pk }}">{{ target.display_name }} ({{ target.get_cadence_display }})</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit" class="btn btn-sm">Merge</button>
</form>
{% endif %}
<form method="get" class="mb-2 flex flex-wrap items-end gap-2">
  <input type="hidden" name="add_series" value="{{ series.pk }}">
  <label class="form-control w-full max-w-xs">
    <span class="label-text">Add charges</span>
    <input type="search" name="q" value="{% if add_series_id == series.pk %}{{ add_query }}{% endif %}" class="input input-bordered input-sm" placeholder="Search descriptions">
  </label>
  <button type="submit" class="btn btn-sm">Find charges</button>
</form>
{% if add_series_id == series.pk %}
  {% if add_candidates %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="series_id" value="{{ series.pk }}">
      <input type="hidden" name="action" value="add">
      <ul class="mb-2 max-h-48 list-disc overflow-y-auto pl-4">
        {% for txn in add_candidates %}
          <li>
            <label class="cursor-pointer">
              <input type="checkbox" name="transaction_id" value="{{ txn.pk }}" class="checkbox checkbox-sm">
              {{ txn.transaction_date }} {{ txn.description }}
              {% include "finance/_amount.html" with value=txn.amount_display tone="" %}
            </label>
          </li>
        {% endfor %}
      </ul>
      <button type="submit" class="btn btn-sm btn-primary">Add selected</button>
    </form>
  {% else %}
    <p class="text-sm opacity-70">No eligible charges match.</p>
  {% endif %}
{% endif %}
