{% extends "finance/base.html" %}
{% block title %}Edit balance · {{ account.name }} · Financial Planner{% endblock %}
{% block content %}
<h1 class="mb-4 text-2xl font-bold">Edit balance</h1>
<p class="mb-4"><a class="link" href="{% url 'account-balances' account.pk %}">{{ account.name }} balances</a></p>
<section class="card bg-base-100 shadow-sm mb-6 max-w-lg">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% include "finance/_form_fields.html" with form=form %}
      <button type="submit" class="btn btn-primary">Save</button>
      <a class="btn" href="{% url 'account-balances' account.pk %}">Cancel</a>
    </form>
  </div>
</section>
{% endblock %}
