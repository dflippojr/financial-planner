{% extends "finance/base.html" %}
{% block title %}Edit savings goal · Financial Planner{% endblock %}
{% block content %}
<h1 class="mb-4 text-2xl font-bold">Edit savings goal</h1>
<section class="card bg-base-100 shadow-sm max-w-lg">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% include "finance/_form_fields.html" with form=form %}
      <div class="flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn btn-ghost" href="{% url 'savings-goals' %}">Cancel</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
