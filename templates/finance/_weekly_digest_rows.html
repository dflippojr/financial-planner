<ul class="flex flex-col">
  {% for item in items %}
  <li class="border-t border-base-300 first:border-t-0">
    <a class="flex min-h-11 flex-wrap items-center justify-between gap-x-3 py-1 hover:underline" href="{{ item.url }}">
      <span class="min-w-0 max-w-full">
        <span class="block truncate">{{ item.title }}</span>
        <span class="block text-sm opacity-80">{{ item.on|date:"D M j" }} · {{ item.detail }}</span>
      </span>
      <span class="ms-auto tabular-nums">{{ item.amount_display }}</span>
    </a>
  </li>
  {% endfor %}
</ul>
