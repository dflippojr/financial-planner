{% comment %}Year-end header action (issue #338): one Export menu with every CSV and Print.{% endcomment %}
<details class="row-menu dropdown dropdown-end no-print" data-row-menu>
  <summary class="btn btn-outline min-h-11 gap-2">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
    Export
    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </summary>
  <ul class="row-menu-list dropdown-content menu rounded-box mt-1 p-1">
    {% for section in csv_sections %}
    <li><a href="{% url 'year-end-csv' section %}{% if csv_query %}?{{ csv_query }}{% endif %}">{{ section|capfirst }} CSV</a></li>
    {% endfor %}
    <li><button type="button" data-print-page>Print or save as PDF</button></li>
  </ul>
</details>
