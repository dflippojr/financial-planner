name: financial-planner

services:
  db:
    # A major version can't open an older major's data directory. Upgrade only
    # with the dump-and-restore runbook in docs/deployment.md, onto a new
    # POSTGRES_VOLUME_NAME. From 18 the image keeps its data in a versioned
    # subdirectory, so the volume mounts at /var/lib/postgresql; it refuses to
    # start on a volume that still holds 16 data, rather than starting empty.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_planner}
      POSTGRES_USER: ${POSTGRES_USER:-financial_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS must be set}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?DJANGO_CSRF_TRUSTED_ORIGINS must be set}
      DJANGO_SECURE_COOKIES: "true"
      DJANGO_SECURE_SSL_REDIRECT: "true"
      # App port is published on 127.0.0.1 only, behind Tailscale Serve, so
      # REMOTE_ADDR is the proxy. Trust the right-most X-Forwarded-For hop.
      TRUST_PROXY_FORWARDED_FOR: "true"
      SETUP_CODE: ${SETUP_CODE:-}
      PRIVACY_POLICY_PATH: ${PRIVACY_POLICY_PATH:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be set}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      ALERT_EMAIL_BASE_URL: ${ALERT_EMAIL_BASE_URL:-}
      SIMPLEFIN_SYNC_CRON: ${SIMPLEFIN_SYNC_CRON:-30 6 * * *}
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${POSTGRES_DB:-financial_planner}
      POSTGRES_USER: ${POSTGRES_USER:-financial_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Staged CSV uploads live on the tmpfs below, so they never reach disk.
      CSV_IMPORT_STAGING_DIR: /run/csv-staging/uploads
      AI_LOCAL_QUIET_WINDOW: ${AI_LOCAL_QUIET_WINDOW:-22:00-06:00}
      AGENT_HARNESS_PROJECT: ${AGENT_HARNESS_PROJECT:-financial-planner}
      AGENT_HARNESS_HOSTED_SESSIONS: ${AGENT_HARNESS_HOSTED_SESSIONS:-false}
      AGENT_HARNESS_SESSION_TIMEOUT_SECONDS: ${AGENT_HARNESS_SESSION_TIMEOUT_SECONDS:-600}
      AGENT_HARNESS_STALE_JOB_MARGIN_SECONDS: ${AGENT_HARNESS_STALE_JOB_MARGIN_SECONDS:-120}
      AI_CHAT_EXPIRE_DAYS: ${AI_CHAT_EXPIRE_DAYS:-30}
      AI_CHAT_MAX_TURNS: ${AI_CHAT_MAX_TURNS:-20}
      AI_CHAT_MAX_TOOL_CALLS: ${AI_CHAT_MAX_TOOL_CALLS:-40}
      AI_CHAT_LOCAL_ENABLED: ${AI_CHAT_LOCAL_ENABLED:-false}
      AI_SHARED_LOCAL_DAILY_CAP: ${AI_SHARED_LOCAL_DAILY_CAP:-200}
      BACKUP_STATUS_PATH: /backup-health/status
      OPERATOR_USERNAMES: ${OPERATOR_USERNAMES:-}
      RECEIPTS_DIR: /receipts
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      # Memory-backed and discarded whenever the container stops. The app creates
      # its own 0700 subdirectory here, so the mount itself needs no fixed user id.
      - /run/csv-staging:size=128m,mode=1777
    volumes:
      - type: bind
        source: ${BACKUP_DIR:?BACKUP_DIR must be set}/health
        target: /backup-health
        read_only: true
        # The backup script creates this directory on its first run; without
        # this, an upgrade would refuse to start the app until then.
        bind:
          create_host_path: true
      - receipts:/receipts
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "financial_planner.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backup:
    build: ops/backup
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_planner}
      POSTGRES_USER: ${POSTGRES_USER:-financial_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      TZ: ${TZ:-America/New_York}
      NIGHTLY_RETENTION: ${NIGHTLY_RETENTION:-14}
      WEEKLY_RETENTION: ${WEEKLY_RETENTION:-8}
      # Days between restore checks of the newest dump into a scratch database; 0 turns it off.
      RESTORE_CHECK_INTERVAL_DAYS: ${RESTORE_CHECK_INTERVAL_DAYS:-7}
      OFFSITE_RCLONE_REMOTE: ${OFFSITE_RCLONE_REMOTE:-}
      OFFSITE_AGE_RECIPIENT: ${OFFSITE_AGE_RECIPIENT:-}
      RCLONE_CONFIG: /config/rclone.conf
      RECEIPTS_DIR: /receipts
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${BACKUP_DIR:?BACKUP_DIR must be set}
        target: /backups
      - type: bind
        source: ${OFFSITE_RCLONE_CONFIG:-./ops/backup/rclone.conf.example}
        target: /config/rclone.conf
        read_only: true
      - receipts:/receipts
    command: ["/opt/financial-planner/run-backups.sh"]

  simplefin-sync:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS must be set}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?DJANGO_CSRF_TRUSTED_ORIGINS must be set}
      DJANGO_SECURE_COOKIES: "true"
      DJANGO_SECURE_SSL_REDIRECT: "true"
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be set}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      ALERT_EMAIL_BASE_URL: ${ALERT_EMAIL_BASE_URL:-}
      SIMPLEFIN_SYNC_CRON: ${SIMPLEFIN_SYNC_CRON:-30 6 * * *}
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${POSTGRES_DB:-financial_planner}
      POSTGRES_USER: ${POSTGRES_USER:-financial_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: db
      # The daily pass sweeps orphaned receipt files, so it needs the receipts volume.
      RECEIPTS_DIR: /receipts
      POSTGRES_PORT: "5432"
      BACKUP_STATUS_PATH: /backup-health/status
      OPERATOR_USERNAMES: ${OPERATOR_USERNAMES:-}
    depends_on:
      db:
        condition: service_healthy
      # The app applies migrations before it reports healthy; starting earlier
      # can query tables a new release has not created yet.
      app:
        condition: service_healthy
    volumes:
      - receipts:/receipts
      - type: bind
        source: ${BACKUP_DIR:?BACKUP_DIR must be set}/health
        target: /backup-health
        read_only: true
        # The backup script creates this directory on its first run; without
        # this, an upgrade would refuse to start the app until then.
        bind:
          create_host_path: true
    entrypoint: ["/app/scripts/run-simplefin-sync.sh"]
    # The image's HTTP health check probes Gunicorn, which this container does
    # not run. The scheduler loop is the main process, so the container stops
    # (and restarts) if it dies; like the backup scheduler, it reports only Up.
    healthcheck:
      disable: true

  ai-jobs:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS must be set}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?DJANGO_CSRF_TRUSTED_ORIGINS must be set}
      DJANGO_SECURE_COOKIES: "true"
      DJANGO_SECURE_SSL_REDIRECT: "true"
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be set}
      AI_LOCAL_QUIET_WINDOW: ${AI_LOCAL_QUIET_WINDOW:-22:00-06:00}
      AI_JOB_POLL_SECONDS: ${AI_JOB_POLL_SECONDS:-15}
      AI_JOB_MAX_ATTEMPTS: ${AI_JOB_MAX_ATTEMPTS:-5}
      AI_JOB_RESUME_DELAY_SECONDS: ${AI_JOB_RESUME_DELAY_SECONDS:-300}
      AI_JOB_RESUME_MAX_AGE_SECONDS: ${AI_JOB_RESUME_MAX_AGE_SECONDS:-86400}
      AI_CHAT_EXPIRE_DAYS: ${AI_CHAT_EXPIRE_DAYS:-30}
      AI_CHAT_MAX_TURNS: ${AI_CHAT_MAX_TURNS:-20}
      AI_CHAT_MAX_TOOL_CALLS: ${AI_CHAT_MAX_TOOL_CALLS:-40}
      AI_CHAT_LOCAL_ENABLED: ${AI_CHAT_LOCAL_ENABLED:-false}
      AI_SHARED_LOCAL_DAILY_CAP: ${AI_SHARED_LOCAL_DAILY_CAP:-200}
      AGENT_HARNESS_PROJECT: ${AGENT_HARNESS_PROJECT:-financial-planner}
      AGENT_HARNESS_HOSTED_SESSIONS: ${AGENT_HARNESS_HOSTED_SESSIONS:-false}
      AGENT_HARNESS_SESSION_TIMEOUT_SECONDS: ${AGENT_HARNESS_SESSION_TIMEOUT_SECONDS:-600}
      AGENT_HARNESS_STALE_JOB_MARGIN_SECONDS: ${AGENT_HARNESS_STALE_JOB_MARGIN_SECONDS:-120}
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${POSTGRES_DB:-financial_planner}
      POSTGRES_USER: ${POSTGRES_USER:-financial_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
      # The app applies migrations before it reports healthy; starting earlier
      # can query tables a new release has not created yet.
      app:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/app/scripts/run-ai-jobs.sh"]
    healthcheck:
      disable: true

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-financial-planner-postgres-data}
  receipts:
    name: ${RECEIPTS_VOLUME_NAME:-financial-planner-receipts}
