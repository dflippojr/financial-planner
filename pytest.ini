[pytest]
DJANGO_SETTINGS_MODULE = financial_planner.test_settings
python_files = tests.py test_*.py *_tests.py
addopts = --strict-markers
markers =
    browser: drives Chromium through Playwright (added automatically to tests that use the browser fixture)
    property: Hypothesis property tests of ledger and cross-view invariants (tests/properties; HYPOTHESIS_PROFILE=deep for a longer search)
