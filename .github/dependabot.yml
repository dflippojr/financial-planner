# Version and security update PRs only. There is no auto-merge; the owner
# reviews and approves every dependency pull request.
#
# docker-compose is listed separately because GitHub split it out of docker;
# both are required so root Dockerfiles and compose.yml postgres stay current.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /
      - /ops/backup
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
