name: Playwright layout

# Runs the browser layout and page tests (every test that uses the "browser"
# fixture; tests/conftest.py marks them "browser") in headless Chromium.
# The other workflows skip them because Playwright is not installed there.
# The whole set takes well under a minute on 4 workers, so every PR runs all
# of it rather than a smoke subset. Uses no secrets and the in-memory SQLite
# test settings; layout does not depend on the database engine.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Cache the Tailwind binary
        uses: actions/cache@v6
        with:
          path: .cache/tailwindcss
          key: tailwindcss-${{ runner.os }}-${{ hashFiles('scripts/css_pins.env') }}

      - name: Build CSS
        run: bash scripts/build_css.sh

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Run browser tests
        env:
          PLAYWRIGHT_TRACE_DIR: test-results/traces
        run: >
          python -m pytest tests -q -p no:cacheprovider -m browser -n 4 -rs
          --ignore=tests/test_ui_instance.py
          --junitxml=test-results/junit.xml

      # The tests skip themselves when Chromium or the CSS is missing, which
      # would turn this job green while checking nothing.
      - name: Fail if browser tests were skipped
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("test-results/junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"{tests} browser tests, {skipped} skipped")
          sys.exit(1 if tests == 0 or skipped else 0)
          PY

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  disposable-ui:
    name: Disposable UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install isolated test tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-test.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Build CSS
        run: bash scripts/build_css.sh
      - name: Sign in and persist a category in a disposable instance
        env:
          PLAYWRIGHT_TRACE_DIR: test-results/ui-traces
        run: >
          .venv/bin/python -m pytest tests/test_ui_instance.py -q
          -p no:cacheprovider --junitxml=test-results/ui-junit.xml
      - name: Upload synthetic report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: disposable-ui-report
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Two legs split the journeys by Playwright project group so each finishes
  # well inside the 20-minute cap. Together they run every project in
  # playwright.config.ts exactly once; keep these lists in step with it.
  ui-pass:
    name: UI journeys (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # desktop-responsive-defects.spec.ts launches WebKit for its iPhone
          # device cases inside the desktop projects, so both legs need WebKit.
          - leg: desktop
            browsers: chromium webkit
            projects: "--project=desktop-light --project=desktop-dark"
          - leg: phone
            browsers: chromium webkit
            projects: "--project=phone-light --project=phone-dark --project='forms-*'"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned UI tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-test.txt
          npm ci
          npx playwright install --with-deps ${{ matrix.browsers }}
      - name: Build CSS
        run: bash scripts/build_css.sh
      - name: Run ${{ matrix.leg }} isolated passing journeys and reflow checks
        run: npm run test:ui -- ${{ matrix.projects }}
      - name: Clean registered synthetic instances
        if: always()
        run: .venv/bin/python -m scripts.cleanup_ui_tests
      - name: Verify report privacy before upload
        id: report-privacy
        if: always()
        run: .venv/bin/python -m scripts.check_ui_report_privacy
      - name: Upload sanitized UI reports
        if: always() && steps.report-privacy.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ui-journeys-report-${{ matrix.leg }}
          path: |
            playwright-report/
            test-results/ui/
          retention-days: 14
          if-no-files-found: ignore
