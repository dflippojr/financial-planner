name: CI

# The one workflow that runs on every pull request and every push to main. It
# calls each test workflow as a reusable workflow and ends in the gate job,
# whose check name (gate) is the single check a ruleset can require. The test
# workflows keep workflow_dispatch for standalone runs, and guards.yml keeps
# its weekly schedule, but none of them triggers on push or pull_request any
# more: that would run every job twice.
#
# Every job runs on every pull request and every push to main, so a change
# under finance/ gets the production-image smoke test too. Any path-filtered
# work would be an if: on a job, never workflow-level paths:, so the gate always
# runs and reports; a skipped job counts as passing.
on:
  push:
    branches: [main]
  pull_request:
    # labeled and unlabeled re-judge gate-change-approved, so a removed approval cannot leave gate green.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Pull request runs cancel the superseded run. Main runs are never cancelled:
# each gets its own group, because even with cancel-in-progress off, a newer
# run in the same group cancels a pending one, and batch merges queue several.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guards:
    name: Guards
    uses: ./.github/workflows/guards.yml

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  postgres:
    name: PostgreSQL 18
    uses: ./.github/workflows/postgres.yml

  sonar:
    name: SonarCloud
    uses: ./.github/workflows/sonar.yml
    secrets: inherit

  playwright:
    name: Playwright
    uses: ./.github/workflows/playwright.yml

  docker-smoke:
    name: Docker smoke
    uses: ./.github/workflows/docker-smoke.yml

  # Pinned to the full SHA of dflippojr/.github main, the same SHA as guard-ref, per the owner's decision on #529.
  # Only pull requests are judged; on push to main the job prints a notice and passes.
  # This job is an early signal inside gate, not the judge: it runs from the PR's head, so a PR can replace it, and it
  # accepts a label applied before the newest push. The ruleset trusts the gate-guard-target / gate-guard job check
  # from gate-guard-target.yml, which runs from main under pull_request_target.
  gate-guard:
    name: Gate guard
    uses: dflippojr/.github/.github/workflows/gate-guard.yml@27bdb76481888567a6c524ebbb19bf4a6c7e7e20
    with:
      guard-ref: fffb84b7fff0a8d68cad4a7da34ed4200e10dc0b
      require-owner-label-actor: true
    permissions:
      contents: read
      issues: read
      pull-requests: read

  gate:
    name: gate
    # always(): report red when a needed job failed or was cancelled, instead
    # of being skipped and leaving a required check pending.
    if: always()
    needs: [guards, lint, postgres, sonar, playwright, docker-smoke, gate-guard]

    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to pass or be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          bad=$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")' <<< "$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error::Failed or cancelled: $bad"
            exit 1
          fi
