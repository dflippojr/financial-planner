name: Repository guards

# Cheap checks for a public repo that handles financial data: no tracked
# statement exports outside the fixture allow-list, no known-vulnerable
# pinned dependency, and no migration-number collision. Uses no secrets. The weekly run surfaces advisories that
# appear on an unchanged pin; it only fails visibly and opens no issue.
on:
  workflow_call:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guards-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  statement-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/check_statement_files.py

  # On a pull request, actions/checkout checks out the merge commit
  # (refs/pull/N/merge), so a migration number that main already took fails
  # here even though makemigrations --check passes on the branch alone.
  migration-numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/check_migration_numbers.py

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit
      # To ignore an advisory that has no fixed release, add
      # --ignore-vuln <ID> here with a dated justification comment.
      # The locked versions, not a fresh resolve: they are what the image ships.
      - run: pip-audit --disable-pip -r requirements.lock
