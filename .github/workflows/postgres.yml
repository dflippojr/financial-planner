name: PostgreSQL 18

# Runs the suite and the migrations on PostgreSQL 18, the production engine.
# sonar.yml runs the same tests on in-memory SQLite, which silently ignores
# behavior PostgreSQL enforces (for example SELECT ... FOR UPDATE with
# DISTINCT). Kept separate so a Postgres failure neither masks nor delays the
# SonarCloud gate. Uses no secrets; scripts/test_postgres.sh is the local
# equivalent.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # About twice the parallel run (issue #358). If the suite outgrows it,
    # find the slow tests rather than raising this.
    timeout-minutes: 25
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Started by hand rather than as a service container because services
      # cannot pass server flags. The data directory is in memory and
      # durability is off: every database here is thrown away, and the suite
      # spends most of its time committing and truncating.
      - name: Start PostgreSQL 18 tuned for throwaway test databases
        run: |
          docker run -d --name postgres \
            --tmpfs /var/lib/postgresql:rw \
            -e POSTGRES_USER=financial_planner -e POSTGRES_PASSWORD=test -e POSTGRES_DB=financial_planner \
            -p 127.0.0.1:5432:5432 postgres:18 \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for _ in $(seq 60); do
            docker exec postgres pg_isready -U financial_planner -d financial_planner && exit 0
            sleep 1
          done
          docker logs postgres
          exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Check migrations are complete and apply to an empty database
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-secret
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      # One pytest-django test database per xdist worker (test_..._gw0 and
      # so on), matching the runner's 4 vCPUs. Browser tests run in
      # playwright.yml on SQLite.
      - name: Run tests on PostgreSQL 18
        env:
          FINANCIAL_PLANNER_TEST_DB: postgres
        run: python -m pytest tests -q -p no:cacheprovider -n 4 --dist worksteal -m "not browser" --durations=40
