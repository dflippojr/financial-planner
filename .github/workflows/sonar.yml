name: SonarCloud

# Briefly disabled on 2026-09-27 while the repo was private and the
# SonarCloud project/token were unconfirmed; enabled again once the repo
# went public. Local SonarQube remains a pre-push check, but it lacks some
# SonarCloud security rules, so this gate is the authoritative one.
#
# Adapted from agent-harness's sonar.yml for this repo's stack (Django +
# pytest, GitHub-hosted Linux runner -- no Windows-native test dependency
# here, so ubuntu-latest instead of windows-latest). A separate self-hosted
# Windows pool handles review.yml, with external-contributor approval,
# a workflow guard, and an owner-installed job-started hook; see
# docs/review-runner.md. This workflow both runs
# the tests (for coverage) and performs the SonarCloud analysis; automatic
# analysis should stay off in the SonarCloud project settings.
#
# pytest.ini already points DJANGO_SETTINGS_MODULE at
# financial_planner.test_settings (SQLite, in-memory), so this job needs no
# database service. That only exercises migrations against SQLite; the
# PostgreSQL 18 run (suite and migrations) lives in postgres.yml.
#
# Coverage is produced here before the scanner runs. sonar.qualitygate.wait
# then fails the check when the SonarCloud quality gate fails, including
# coverage on new code (Sonar way: 80%).
#
# The coverage run is split into three shards (issue #691). As one job it took
# 9 to 18 minutes against its 20-minute step limit, depending on the runner:
# about 5,000 tests, none dominant, so only fewer tests per runner shortens
# it. Each shard runs every third test (pytest --coverage-shard K/N, see
# tests/conftest.py) and uploads its coverage data and JUnit report. The scan
# job proves from those reports that the shards together ran every
# non-browser test exactly once (scripts/check_coverage_shards.py), combines
# the data, applies the .coveragerc fail_under floor to the combined total and
# writes the coverage.xml the scanner reads. Combined, the shards measure the
# same lines and branches the single run did.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  coverage:
    name: coverage (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Secrets are not passed to pull requests from forks; skip rather than fail.
    # Every other event runs, including manual runs of ci.yml or this file.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      # Every shard reports, so one failure does not hide another's.
      fail-fast: false
      matrix:
        # To change the count, change the 3 in the job name, in
        # --coverage-shard and in scripts/ci-local.sh
        # (tests/test_check_coverage_shards.py keeps them in step).
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.lock

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary :all: -r requirements-test.lock

      # 4 xdist workers, matching the runner's 4 vCPUs; pytest-cov merges
      # their coverage into this shard's data file. Browser tests run in
      # playwright.yml (no Chromium here). A shard alone covers less than
      # the floor, so --cov-fail-under=0 here and the scan job applies the
      # .coveragerc fail_under to the combined data.
      - name: Run tests with coverage
        timeout-minutes: 20
        env:
          COVERAGE_FILE: .coverage.shard-${{ matrix.shard }}
        run: >
          python -m pytest tests -q -n 4 --dist worksteal -m "not browser"
          --coverage-shard ${{ matrix.shard }}/3
          --cov=. --cov-report= --cov-fail-under=0
          --junitxml=junit-shard-${{ matrix.shard }}.xml

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: |
            .coverage.shard-${{ matrix.shard }}
            junit-shard-${{ matrix.shard }}.xml
          # .coverage.* files are hidden, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  sonar:
    runs-on: ubuntu-latest
    needs: coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so SonarCloud can blame lines and find the PR base.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.lock

      # The full set: the shard check collects the tests, which imports Django.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary :all: -r requirements-test.lock

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: coverage-shards
          merge-multiple: true

      - name: Check the shards ran every non-browser test exactly once
        run: python scripts/check_coverage_shards.py coverage-shards/junit-shard-*.xml

      # coverage report fails below the fail_under floor in .coveragerc.
      - name: Combine coverage and apply the floor
        run: |
          python -m coverage combine coverage-shards
          python -m coverage report
          python -m coverage xml -o coverage.xml

      - name: Scan with SonarCloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true
