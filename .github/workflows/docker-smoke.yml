name: Docker smoke test

# Builds the production images and starts all four compose services (db, app,
# backup, background) against a throwaway PostgreSQL, so a broken Dockerfile,
# CSS pin, missing static asset, bad start script, crash-looping background or
# backup container, or a backup that does not restore fails here instead of
# during a deploy. The assertions live in scripts/docker-smoke.sh. It uses
# compose.yml with an env file of dummy values: no secrets, no real paths,
# nothing is pushed.
# ci.yml calls it on every pull request and every push to main, with no path
# filter, and the gate job needs it.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 12
    env:
      COMPOSE_PROJECT_NAME: fp-smoke
    steps:
      - uses: actions/checkout@v7

      - name: Build, start db app backup background, and assert
        run: bash scripts/docker-smoke.sh
